name: Scrape Tubi

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC
  workflow_dispatch:       # allows manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape-tubi
  cancel-in-progress: false

jobs:
  scrape-tubi:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pysocks

      - name: Run tubi_scraper.py
        run: python tubi_scraper.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tubi_playlist.m3u tubi_epg.xml tubi_fallback_ids.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Tubi playlist and EPG - $(date -u +'%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done

          echo "Push failed after 3 attempts"
          exit 1
